# SPDX-License-Identifier: Apache-2.0
# Phoenix test matrix — consumed by run_matrix.sh (one case per line).
#
# Columns (whitespace separated; COMMAND is the rest of the line):
#   ID       unique case name (used by --only / --skip regex filters)
#   KMOD     kernel module state the case needs:
#              full | staging  -> phoenixfs loaded with phxfs_map_mode=0 / 1
#                                 (the runner reloads only when the mode changes)
#              none            -> phoenixfs NOT loaded
#              keep            -> whatever is loaded now (builtins that manage it)
#   ENV      "-" or comma separated K=V for the test process, e.g.
#              PHXFS_MODE=auto,PHXFS_IO_ENGINE=sync
#   TIMEOUT  seconds (a kernel hang shows up as TIMEOUT; check the .dmesg file)
#   EXPECT   pass   : exit 0 and no "[FAIL]" line
#            strict : pass and no "[SKIP]" line (environment must really work)
#            skip   : exit 0 and at least one "[SKIP]" line
#            fail   : non-zero exit
#            xfail  : known failure, reported as XFAIL (XPASS once it passes)
#                     without failing the run; say why in a comment
#   COMMAND  shell command, or a runner builtin starting with "@":
#              @check_load            module/sysfs/dev-node sanity for this mode
#              @reload N              rmmod + insmod N times in this mode
#              @switch_modes N        N rounds of full <-> staging reloads
#              @rmmod_busy            rmmod must fail while a mapping is held,
#                                     holder killed -9, refcnt back to 0, reload
#              @double_insmod         a second insmod must fail, module unharmed
#              @bad_load PARAMS...    insmod with PARAMS must fail cleanly
#              @wc_hold_block MODE    bar_holder holds a whole-BAR WC mapping
#                                     (sysfs resource*_wc); the load outcome is
#                                     decided by the kernel's own memtype /
#                                     memory-add path: clean refusal with a real
#                                     errno where PAT is enforced, success where
#                                     it is not (plain-ioremap foreign mapping,
#                                     no struct pages). Never the foreign-pgmap
#                                     refusal, never a WARN; holder released ->
#                                     same mode reloads fine
#              @wc_partial OFF LEN    bar_holder holds a LEN MiB WC window at
#                                     OFF MiB; FULL must load, routing around
#                                     the conflicted probe blocks
#              @refcnt_zero           /sys/module/phoenixfs/refcnt drains to 0
#
# Placeholders: {BIN} {BUILD} {REPO} {GPU} {GPU2} {FILE}
#
# Every case is followed by a kernel check: new dmesg lines matching
# BUG/WARNING/Oops/KASAN/refcount/soft lockup/hung task/phxfs "unbalanced put"
# and newly set taint bits (W/D/B/M/L) turn a passing case into KFAIL.

# ID                       KMOD     ENV                               TIMEOUT EXPECT COMMAND

# ---- 0. no kernel module: CPU-only and HOST staging ---------------------------------
cpu.batch_sync             none     -                                 300     pass   {BIN}/test_batch_sync
cpu.batch_async            none     -                                 300     pass   {BIN}/test_batch_async
# test_regmem Test 5 expects STAGING no-op semantics for every non-FULL mode, but
# HOST deregistration of an unknown range returns -1 like FULL does.
host.regmem                none     PHXFS_MODE=host_staging           300     xfail  {BIN}/test_regmem {GPU}
host.io                    none     PHXFS_MODE=host_staging           900     pass   {BIN}/test_io {GPU}
host.io.sync_engine        none     PHXFS_MODE=host_staging,PHXFS_IO_ENGINE=sync 900 pass {BIN}/test_io {GPU}
host.batch.sync            none     PHXFS_MODE=host_staging           900     strict {BIN}/test_batch {FILE} 1 {GPU} both sync
host.batch.async           none     PHXFS_MODE=host_staging           900     strict {BIN}/test_batch {FILE} 1 {GPU} both async
host.batch.2gpu            none     PHXFS_MODE=host_staging           900     strict {BIN}/test_batch {FILE} 2 {GPU} both async
host.stream.unsupported    none     PHXFS_MODE=host_staging           300     skip   {BIN}/test_stream {FILE} {GPU}
auto.nomodule.regmem       none     PHXFS_MODE=auto                   300     xfail  {BIN}/test_regmem {GPU}
auto.nomodule.io           none     PHXFS_MODE=auto                   900     pass   {BIN}/test_io {GPU}

# ---- 1. FULL mode -------------------------------------------------------------------
full.load                  full     -                                 120     pass   @check_load
full.double_insmod         full     -                                 120     pass   @double_insmod
full.ioctl.contract        full     -                                 600     strict {BIN}/test_ioctl {GPU} contract
full.ioctl.reclaim         full     -                                 300     strict {BIN}/test_ioctl {GPU} reclaim
full.ioctl.race            full     TEST_IOCTL_ITERS=200              1200    strict {BIN}/test_ioctl {GPU} race
full.ioctl.die             full     -                                 120     pass   {BIN}/test_ioctl {GPU} die
full.ioctl.die_reset       full     -                                 120     pass   {BIN}/test_ioctl {GPU} die_reset
full.refcnt_after_die      full     -                                 60      pass   @refcnt_zero
full.ioctl.after_die       full     -                                 300     strict {BIN}/test_ioctl {GPU} basic
full.ioctl.gpu2            full     -                                 600     strict {BIN}/test_ioctl {GPU2} contract
# test_regmem skips its STAGING-only Issue #26 case outside STAGING: "pass", not "strict".
full.regmem                full     -                                 600     pass   {BIN}/test_regmem {GPU}
full.io                    full     -                                 900     strict {BIN}/test_io {GPU}
full.io.sync_engine        full     PHXFS_IO_ENGINE=sync              900     strict {BIN}/test_io {GPU}
full.batch.sync            full     -                                 900     strict {BIN}/test_batch {FILE} 1 {GPU} both sync
full.batch.async           full     -                                 900     strict {BIN}/test_batch {FILE} 1 {GPU} both async
full.batch.2gpu            full     -                                 900     strict {BIN}/test_batch {FILE} 2 {GPU} both async
full.stream                full     -                                 600     strict {BIN}/test_stream {FILE} {GPU}
full.auto.regmem           full     PHXFS_MODE=auto                   600     pass   {BIN}/test_regmem {GPU}
full.auto.io               full     PHXFS_MODE=auto                   900     strict {BIN}/test_io {GPU}
full.host_forced.io        full     PHXFS_MODE=host_staging           900     pass   {BIN}/test_io {GPU}
full.refcnt_idle           full     -                                 60      pass   @refcnt_zero
full.rmmod_busy            full     -                                 300     pass   @rmmod_busy
full.reload                full     -                                 600     pass   @reload 3
full.ioctl.after_reload    full     -                                 300     strict {BIN}/test_ioctl {GPU} basic

# ---- 2. STAGING mode ----------------------------------------------------------------
staging.load               staging  -                                 120     pass   @check_load
staging.ioctl.contract     staging  -                                 600     strict {BIN}/test_ioctl {GPU} contract
staging.ioctl.reclaim      staging  -                                 300     strict {BIN}/test_ioctl {GPU} reclaim
staging.ioctl.race         staging  TEST_IOCTL_ITERS=100              1800    strict {BIN}/test_ioctl {GPU} race
staging.ioctl.die          staging  -                                 120     pass   {BIN}/test_ioctl {GPU} die
staging.ioctl.die_reset    staging  -                                 120     pass   {BIN}/test_ioctl {GPU} die_reset
staging.refcnt_after_die   staging  -                                 60      pass   @refcnt_zero
staging.ioctl.after_die    staging  -                                 300     strict {BIN}/test_ioctl {GPU} basic
staging.regmem             staging  -                                 600     strict {BIN}/test_regmem {GPU}
staging.io                 staging  -                                 900     strict {BIN}/test_io {GPU}
staging.io.sync_engine     staging  PHXFS_IO_ENGINE=sync              900     strict {BIN}/test_io {GPU}
staging.io.pool_2g         staging  PHX_STAGING_SIZE_MB=2048          900     strict {BIN}/test_io {GPU}
staging.io.pool_odd        staging  PHX_STAGING_SIZE_MB=3             900     strict {BIN}/test_io {GPU}
staging.batch.sync         staging  -                                 900     strict {BIN}/test_batch {FILE} 1 {GPU} both sync
staging.batch.async        staging  -                                 900     strict {BIN}/test_batch {FILE} 1 {GPU} both async
staging.batch.2gpu         staging  -                                 900     strict {BIN}/test_batch {FILE} 2 {GPU} both async
staging.stream             staging  -                                 600     strict {BIN}/test_stream {FILE} {GPU}
staging.stream.pool_2g     staging  PHX_STAGING_SIZE_MB=2048          600     strict {BIN}/test_stream {FILE} {GPU}
staging.auto.io            staging  PHXFS_MODE=auto                   900     strict {BIN}/test_io {GPU}
staging.refcnt_idle        staging  -                                 60      pass   @refcnt_zero
staging.rmmod_busy         staging  -                                 300     pass   @rmmod_busy
staging.reload             staging  -                                 600     pass   @reload 3
staging.ioctl.after_reload staging  -                                 300     strict {BIN}/test_ioctl {GPU} basic

# ---- 3. load / unload robustness ----------------------------------------------------
load.switch_modes          keep     -                                 1200    pass   @switch_modes 3
load.bad.numa_no_gpu       keep     -                                 120     pass   @bad_load phxfs_map_mode=0 phxfs_numa_node=255
load.full.debug            full     -                                 120     pass   @reload 1 phxfs_debug=1
load.staging.debug         staging  -                                 120     pass   @reload 1 phxfs_debug=1

# ---- 4. PAT conflicts over the BAR (metax field report) -----------------------------
# bar_holder mmaps the GPU BAR via sysfs resource*_wc, the same mechanism a
# misbehaving tool/driver uses, so phoenixfs sees the exact condition from the
# metax machine: a write-combining entry covering (part of) the BAR at load.
load.wc_block.full         keep     -                                 300     pass   @wc_hold_block full
load.wc_block.staging      keep     -                                 300     pass   @wc_hold_block staging
load.wc_partial.full       keep     -                                 300     pass   @wc_partial 64 16
